
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: DSSP-TargetP-11-default
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/BackstageSSPPoC/k8s-manifests.git
    targetRevision: main
    path: apps/DSSP-TargetP-11/default

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
