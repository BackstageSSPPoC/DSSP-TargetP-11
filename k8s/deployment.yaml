apiVersion: apps/v1
kind: Deployment
metadata:
  name: DSSP-TargetP-11
  namespace: dev
  labels:
    app: DSSP-TargetP-11
spec:
  replicas: 2
  selector:
    matchLabels:
      app: DSSP-TargetP-11
  template:
    metadata:
      labels:
        app: DSSP-TargetP-11
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: DSSP-TargetP-11
          image: REGISTRY/DSSP-TargetP-11:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
          - name: PORT
            value: "8000"
          - name: NODE_ENV
            value: "production"
          - name: PYTHONUNBUFFERED
            value: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10